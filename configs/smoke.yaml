dataset:
  name: synthetic
  download: false
  iid: true
  split: [0.8, 0.1, 0.1]
  min_client_samples: 10
  synthetic_train_size: 80
  synthetic_image_size: 32
  synthetic_num_classes: 10
  synthetic_channels: 3
federation:
  num_clients: 2
  participation_rate: 1.0
  rounds: 1
model:
  family: cnn
  heterogeneous: false
  cnn_variants: [5]
training:
  local_epochs: 1
  batch_size: 16
  num_workers: 0
behavior:
  synthetic_size: 2
  virtual_steps: 1
  warmup_rounds: 1
attack:
  name: none
runtime:
  seed: 2026
  device: auto
  eval_every: 1
  output_dir: ./runs/smoke
